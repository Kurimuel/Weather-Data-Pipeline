name: Tests

# รันเทสต์อัตโนมัติทุกครั้งที่ push เข้า main หรือเปิด/อัปเดต pull request
# + กดรันเองได้จากหน้า GitHub (workflow_dispatch)
# ไม่ใช้ secret ใดๆ และไม่ยิง API จริง: เทสต์ใช้ข้อมูลจำลอง และฐานข้อมูล PostgreSQL ชั่วคราวใน container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL ชั่วคราวสำหรับ tests/test_db_integration.py (ถูกทิ้งทันทีเมื่อ job จบ)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-pipeline.txt
            requirements-sync.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
