name: Sync to BigQuery

# รันวันละครั้ง (ต่างจาก fetch_weather.yml ที่รันทุกชั่วโมง เพราะ
# BigQuery เหมาะกับการวิเคราะห์ข้อมูลก้อนใหญ่เป็นรอบ ไม่ต้อง real-time
# เท่า OLTP database) + กดรันเองได้ตอนทดสอบ
on:
  # --- หยุดรันอัตโนมัติชั่วคราว: เอา # หน้า 2 บรรทัดนี้ออกเพื่อเปิดใช้งานอีกครั้ง ---
  # (ต้องคอมเมนต์ทั้งบล็อก schedule: ไม่ใช่เฉพาะบรรทัด cron มิฉะนั้น YAML จะไม่ถูกต้อง)
  schedule:
  - cron: "17 2 * * *"  # 02:17 UTC ทุกวัน (นาทีสุ่ม เลี่ยง peak load เหมือน workflow อื่น)
  workflow_dispatch:

# กันรันซ้อนกัน: ถ้ารอบก่อนยังไม่จบ รอบใหม่จะรอคิว (ไม่ยกเลิกรอบที่กำลังทำงานอยู่)
# สำคัญต่อ BQ_WRITE_STRATEGY=anti_join ซึ่งไม่ atomic เท่า MERGE ถ้ารันซ้อนกันอาจเกิดข้อมูลซ้ำ
concurrency:
  group: bigquery-sync
  cancel-in-progress: false

jobs:
  sync-bigquery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                          # เก็บ cache ของ pip ไว้ให้รอบถัดไปติดตั้งเร็วขึ้น
          cache-dependency-path: requirements-sync.txt

      - name: Install dependencies
        run: pip install -r requirements-sync.txt

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > gcp-service-account-key.json

      - name: Run BigQuery sync
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ./gcp-service-account-key.json
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_DATASET: weather_pipeline
          BQ_TABLE: weather_readings
          # ตั้งได้ที่ Settings > Secrets and variables > Actions > Variables (ไม่ตั้ง = ใช้ค่าเริ่มต้นของโค้ด)
          #   BQ_WRITE_STRATEGY: merge (ค่าเริ่มต้น, ต้องเปิด billing) หรือ anti_join (ใช้ได้ใน sandbox)
          #   BQ_LOOKBACK_HOURS: ชั่วโมงที่ดึงย้อนหลังเผื่อ (ค่าเริ่มต้น 6)
          BQ_WRITE_STRATEGY: ${{ vars.BQ_WRITE_STRATEGY }}
          BQ_LOOKBACK_HOURS: ${{ vars.BQ_LOOKBACK_HOURS }}
        run: python bigquery_sync.py

      - name: Clean up credentials file
        if: always()
        run: rm -f gcp-service-account-key.json
