name: Diagnose Open-Meteo API (temporary)

# workflow วินิจฉัยชั่วคราว กดรันเองเท่านั้น (ไม่มี schedule)
# ยิง Open-Meteo จากบน runner ของ GitHub เพื่อหาสาเหตุที่บางคำขอ Timeout ตอน fetch
# ไม่ใช้ secret ไม่เขียน Supabase/BigQuery ลบทิ้งได้เมื่อหาสาเหตุเจอแล้ว
#
# เวอร์ชัน 2 ทดสอบในรอบเดียว: ช่วงพักหลายค่า, ที่อยู่ IP ที่ใช้, และเวลาที่คำขอที่ล้มฟื้นตัว
# ใช้เวลาประมาณ 15 ถึง 35 นาที (ขึ้นกับจำนวนคำขอที่ล้ม) ซึ่งนับเป็นโควตา Actions ถ้า repo เป็น private
# ถ้าอยากให้สั้นลง ให้ลดตารางช่วงพัก เช่น "5,120" (3 รอบ)
on:
  workflow_dispatch:
    inputs:
      pause_schedule:
        description: "ช่วงพักก่อนรอบที่ 2, 3, ... (วินาที คั่นด้วยจุลภาค) เช่น 5,120,5,120,30,30 = 7 รอบ"
        default: "5,120,5,120,30,30"
      max_recovery_probes:
        description: "จำนวนคำขอที่ล้มซึ่งจะวัดการฟื้นตัวเต็มรูปแบบ (แต่ละครั้งใช้เวลาได้ถึง ~100 วินาที)"
        default: "6"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # กรณีแย่สุด (ล้มเกือบทุกคำขอ) อาจใช้เกิน 30 นาที จึงตั้งเพดานไว้ 60 นาที
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      # ใช้ไฟล์เดียวกับ workflow fetch เพื่อให้ requests/urllib3 เป็นเวอร์ชันเดียวกับของจริง
      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run diagnostics
        env:
          PAUSE_SCHEDULE: ${{ inputs.pause_schedule }}
          MAX_RECOVERY_PROBES: ${{ inputs.max_recovery_probes }}
        run: python diagnose_api.py
