name: Fetch Weather Data

# รันอัตโนมัติทุก 1 ชั่วโมง + สามารถกดรันเองได้จากหน้า GitHub (workflow_dispatch)
on:
  schedule:
    - cron: "0 * * * *"  # นาทีที่ 0 ของทุกชั่วโมง (เวลา UTC)
  workflow_dispatch:       # ปุ่ม "Run workflow" กดรันเองได้ตอนทดสอบ

jobs:
  fetch-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python fetch_weather.py
