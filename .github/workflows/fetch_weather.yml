name: Fetch Weather Data

# รันอัตโนมัติทุก 1 ชั่วโมง + สามารถกดรันเองได้จากหน้า GitHub (workflow_dispatch)
on:
  # --- หยุดรันอัตโนมัติชั่วคราว: เอา # หน้า 2 บรรทัดนี้ออกเพื่อเปิดใช้งานอีกครั้ง ---
  # (ต้องคอมเมนต์ทั้งบล็อก schedule: ไม่ใช่เฉพาะบรรทัด cron มิฉะนั้น YAML จะไม่ถูกต้อง)
  # schedule:
  - cron: "23 * * * *"  # นาทีที่ 23 ของทุกชั่วโมง (เวลา UTC)
  workflow_dispatch:       # ปุ่ม "Run workflow" กดรันเองได้ตอนทดสอบ

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    # กัน job ค้างกินโควตา: โหมดรวมแย่สุดใช้ ~2.5 นาที โหมดเมืองต่อเมืองแย่สุด ~10 นาที
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                          # เก็บ cache ของ pip ไว้ให้รอบถัดไปติดตั้งเร็วขึ้น
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # ตั้งได้ที่ Settings > Secrets and variables > Actions > Variables (ไม่ตั้ง = batch)
          #   FETCH_MODE=batch     ยิง API ครั้งเดียวทุกเมือง (ค่าเริ่มต้น)
          #   FETCH_MODE=per_city  ย้อนกลับไปยิงทีละเมืองแบบเดิม
          FETCH_MODE: ${{ vars.FETCH_MODE }}
        run: python fetch_weather.py
